name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: docker/Dockerfile.frontend
            image: excalidraw-frontend
          - service: backend
            dockerfile: docker/Dockerfile.backend
            image: excalidraw-backend
          - service: ws
            dockerfile: docker/Dockerfile.ws
            image: excalidraw-ws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          BUILD_ARGS=""
          if [ "${{ matrix.service }}" == "frontend" ]; then
            BUILD_ARGS="--build-arg NEXT_PUBLIC_HTTP_BACKEND_URL=${{ secrets.NEXT_PUBLIC_HTTP_BACKEND_URL }} --build-arg NEXT_PUBLIC_WS_BACKEND_URL=${{ secrets.NEXT_PUBLIC_WS_BACKEND_URL }}"
          fi

          docker build \
            --progress=plain \
            --no-cache \
            $BUILD_ARGS \
            -f ${{ matrix.dockerfile }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
