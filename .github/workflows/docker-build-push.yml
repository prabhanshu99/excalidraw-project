name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: docker/Dockerfile.frontend
            image: excalidraw-frontend
          - service: backend
            dockerfile: docker/Dockerfile.backend
            image: excalidraw-backend
          - service: ws
            dockerfile: docker/Dockerfile.ws
            image: excalidraw-ws

    steps:
      # ── Checkout source code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Docker Buildx (enables caching & multi-platform) ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to Docker Hub ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Extract metadata (tags, labels) ──
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            # tag "latest" on every push to main
            type=raw,value=latest,enable={{is_default_branch}}
            # tag with short SHA  (e.g. "abc1234")
            type=sha,prefix=,format=short
            # tag with date  (e.g. "2026-04-23")
            type=raw,value={{date 'YYYY-MM-DD'}}

      # ── Build & Push ──
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
