version: "3.8"

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: excalidraw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── HTTP Backend (Express) ──
  http-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/excalidraw
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  # ── WebSocket Backend ──
  ws-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/excalidraw
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Frontend ──
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_HTTP_BACKEND_URL: http://localhost:3001
      NEXT_PUBLIC_WS_BACKEND_URL: ws://localhost:3002
    depends_on:
      - http-backend
      - ws-backend

volumes:
  pgdata:
